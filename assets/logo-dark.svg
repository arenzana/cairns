<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="cairns" color="#E3EBF1">
  <!-- The mark: a cairn on a summit above a vector lattice. currentColor drives
       everything but the gold arc, so the dashboard can recolour it for a dark
       background by setting `color` while the favicon keeps the brand navy. -->
  <g fill="none" stroke-width="5">
    <path d="M70.5 88.6 A44 44 0 1 1 70.5 11.4" stroke="currentColor"/>
    <path d="M70.5 11.4 A44 44 0 0 1 70.5 88.6" stroke="#C29551"/>
  </g>

  <!-- Peak. Two faces so the ridge reads at favicon size; the left is lifted in
       opacity rather than given its own colour, so recolouring stays one knob. -->
  <path d="M50 19 L39 38 L34 32 L26 47 L22 43 L18 59 L50 59 Z"
        fill="currentColor" opacity=".58"/>
  <path d="M50 19 L61 35 L67 29 L74 43 L79 39 L84 59 L50 59 Z"
        fill="currentColor"/>

  <!-- Lattice, in the open ground below the slopes where it stays legible -->
  <g stroke="currentColor" stroke-width="1.8" fill="none">
    <path d="M50 57 L39 63 M50 57 L61 63 M50 57 L50 70
             M39 63 L29 68 M39 63 L50 70 M61 63 L71 68 M61 63 L50 70
             M29 68 L39 76 M39 76 L50 70 M71 68 L61 76 M61 76 L50 70"/>
  </g>
  <g fill="currentColor">
    <circle cx="50" cy="57" r="3.2"/>
    <circle cx="39" cy="63" r="3.2"/><circle cx="61" cy="63" r="3.2"/>
    <circle cx="29" cy="68" r="3.2"/><circle cx="71" cy="68" r="3.2"/>
    <circle cx="50" cy="70" r="3.2"/>
    <circle cx="39" cy="76" r="3.2"/><circle cx="61" cy="76" r="3.2"/>
  </g>
</svg>
