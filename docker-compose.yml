# cairns: local semantic retrieval over your own files, and whatever sources you
# plug in beside them.
#
# Ollama is deliberately NOT here. Docker Desktop on macOS runs containers in a
# Linux VM with no Metal passthrough, so a containerised Ollama falls back to
# CPU and turns an 11-minute index into hours. It runs natively via Homebrew and
# the containers reach it at host.docker.internal:11434, which requires
# OLLAMA_HOST=0.0.0.0 on the host because the default 127.0.0.1 bind is
# unreachable from a container.

name: cairns

services:
  postgres:
    # Pinned to an exact pgvector AND postgres version, not a floating major
    # tag. pg18 + pgvector 0.8.6 are the newest as of 2026-09-24; trixie is the
    # Debian 13 base. A version-specific tag does not move under you, which
    # matters because a postgres major bump cannot read the previous major's
    # data directory: changing this line means dump, recreate, restore.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: cairns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cairns
      POSTGRES_DB: cairns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only. This database holds the full text of everything indexed,
      # so it must not be reachable from the LAN or the tailnet. 5433 avoids
      # colliding with any other local postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      # A NAMED VOLUME, deliberately, not a bind mount.
      #
      # Bind-mounting a Postgres data directory does not work on Docker Desktop
      # for macOS: VirtioFS maps ownership to the host uid, Postgres refuses to
      # start on a data directory it does not own ("data directory has wrong
      # ownership"), and the retry then sees a non-empty directory and skips
      # initialisation, leaving a cluster with no database. Verified 2026-09-24.
      #
      # Portability and backup are solved by ./backups instead: pg_dump writes
      # there and the dump is restorable anywhere. That is also the only correct
      # way to back up a running cluster, since copying live data files gives
      # you a torn, unrestorable snapshot whatever the platform.
      #
      # NOTE the mount point: postgres 18 changed convention. The volume goes at
      # /var/lib/postgresql, NOT /var/lib/postgresql/data, so the image can keep
      # data in a major-version subdirectory and pg_upgrade --link can work
      # across a major bump without crossing a mount boundary. Mounting at /data
      # on 18+ makes the container refuse to start.
      - pgdata:/var/lib/postgresql
      # Bind-mounted, so dumps land on the host where you can see and sync them.
      - ./backups:/backups
      # Runs on FIRST boot only, when the data directory is empty. Changing a
      # file here does nothing to an existing volume.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairns -d cairns"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  cairnsd:
    build: .
    image: cairns:local
    container_name: cairns-indexer
    restart: unless-stopped
    command: ["/usr/local/bin/cairnsd", "-interval", "5m"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cairns:${POSTGRES_PASSWORD}@postgres:5432/cairns
      # Ollama is native on the host (no Metal in the Linux VM), reached over
      # the Docker gateway. Requires OLLAMA_HOST=0.0.0.0 on the host.
      OLLAMA_URL: http://host.docker.internal:11434
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIMS: ${EMBED_DIMS:-}
      # The CONTAINER's view of the indexed directory. Indexing reads from here.
      FS_PATH: /data
      # Second source. Absent credentials means the source is skipped, not an
      # error, so cairns still runs with just the filesystem source.
      TWENTY_BASE_URL: ${TWENTY_BASE_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${FS_HOST_PATH:?set FS_HOST_PATH in .env}:/data:ro"

  cairns-serve:
    build: .
    image: cairns:local
    container_name: cairns-serve
    restart: unless-stopped
    # Bind 0.0.0.0 INSIDE the container: 127.0.0.1 there is the container's own
    # loopback and the port mapping cannot reach it (connection refused, no log
    # line). Host-side exposure stays private via the 127.0.0.1 ports mapping
    # below, which is where "loopback only" is actually enforced.
    command: ["/usr/local/bin/cairns-serve", "-addr", "0.0.0.0:8765"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cairns:${POSTGRES_PASSWORD}@postgres:5432/cairns
      OLLAMA_URL: http://host.docker.internal:11434
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIMS: ${EMBED_DIMS:-}
      # The HOST's view of the directory, deliberately different from FS_PATH
      # above. Search returns locators for an agent running on the host to
      # open, so a container path like /data would be useless to it.
      FS_HOST_PATH: ${FS_HOST_PATH}
      # Optional: an Obsidian vault NAME turns results into obsidian:// links.
      OBSIDIAN_VAULT: ${OBSIDIAN_VAULT:-}
      # Injected at `docker compose up` time, e.g. by running compose under
      # `op run`. Note it is then stored in the container config so a restart
      # after reboot works without 1Password being unlocked.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Used only to turn a twenty: locator into a link to the record.
      TWENTY_WEB_URL: ${TWENTY_WEB_URL:-}
      # Read-only view of the eval output, so the dashboard can show retrieval
      # quality without being able to run (or bill) the harness itself.
      EVAL_DIR: /eval
      # Optional UI font. Drop a ui.woff2 into ./fonts and the dashboard picks
      # it up; with none there the request 404s and the browser falls back to
      # the system font. Nothing is vendored, see fonts/README.md.
      FONT_PATH: /font/ui.woff2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only on purpose: the dashboard reports eval results, it never
      # writes them, and cairns-eval runs on the host.
      - "./eval:/eval:ro"
      - "./fonts:/font:ro"
    ports:
      # Loopback only: this serves the MCP endpoint and the dashboard, both of
      # which expose the corpus.
      - "127.0.0.1:8765:8765"

volumes:
  pgdata:
    name: cairns-pgdata
