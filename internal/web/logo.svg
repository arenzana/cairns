<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="cairns" color="#2A3444">
  <!-- The mark: a cairn on a summit above a vector lattice. currentColor drives
       everything but the gold arc, so the dashboard can recolour it for a dark
       background by setting `color` while the favicon keeps the brand navy. -->
  <g fill="none" stroke="currentColor" stroke-width="4.5">
    <path d="M68.6 89.9 A44 44 0 1 1 68.6 10.1"/>
  </g>
  <g fill="none" stroke="#C29551" stroke-width="4.5" stroke-linecap="butt">
    <path d="M68.6 10.1 A44 44 0 0 1 68.6 89.9"/>
  </g>

  <!-- Peak, two faces so the ridge reads at small sizes -->
  <path d="M50 19 L41 34 L36 29 L28 45 L23 40 L18 61 L50 61 Z"
        fill="currentColor" opacity=".78"/>
  <path d="M50 19 L59 34 L64 29 L72 45 L77 40 L82 61 L50 61 Z"
        fill="currentColor"/>

  <!-- Lattice -->
  <g stroke="currentColor" stroke-width="2.4" fill="none">
    <path d="M50 45 L36 53 M50 45 L64 53 M50 45 L50 61
             M36 53 L24 60 M36 53 L50 61 M64 53 L76 60 M64 53 L50 61
             M24 60 L36 69 M36 69 L50 61 M76 60 L64 69 M64 69 L50 61"/>
  </g>
  <g fill="currentColor">
    <circle cx="50" cy="45" r="4.2"/>
    <circle cx="36" cy="53" r="4.2"/><circle cx="64" cy="53" r="4.2"/>
    <circle cx="24" cy="60" r="4.2"/><circle cx="76" cy="60" r="4.2"/>
    <circle cx="50" cy="61" r="4.2"/>
    <circle cx="36" cy="69" r="4.2"/><circle cx="64" cy="69" r="4.2"/>
  </g>
</svg>
